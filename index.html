/* ===== games/vismem.js : Visual memory - lit patterns, Corsi sequences and change detection ===== */
'use strict';
(() => {
  const { h } = U;
  const MODES = ['pattern', 'corsi', 'change'];
  const MODE_NAMES = { pattern: 'מטריצת זיכרון', corsi: 'רצף קורסי', change: 'מה השתנה?' };

  function make({ level, diff, seed }) {
    const rnd = U.rng(seed);
    const mode = level ? MODES[(level - 1) % 3] : rnd.weighted(MODES, [3, 2, 2]);
    const f = U.clamp((diff - 1) / 9, 0, 1);
    if (mode === 'pattern') {
      const G = diff < 2.5 ? 3 : diff < 5 ? 4 : diff < 7.5 ? 5 : 6;
      const K = Math.min(Math.floor(G * G * 0.45), U.clamp(Math.round(2 + diff * 1.05), 3, 13));
      const cells = rnd.sample(U.range(G * G), K).sort((a, b) => a - b);
      const ms = Math.round((900 + K * 260) * U.lerp(1.2, 0.8, f));
      return { diff, mode, G, K, cells, ms, title: `${MODE_NAMES.pattern} · ${K} משבצות`, extra: { m: 'p', k: K }, par: ms + 9000 + K * 1200 };
    }
    if (mode === 'corsi') {
      const G = diff < 5 ? 3 : 4;
      const len = U.clamp(Math.round(2.5 + diff * 0.62), 3, 9);
      const seq = []; while (seq.length < len) { const c = rnd.int(0, G * G - 1); if (c !== seq[seq.length - 1] && !(seq.length >= 2 && c === seq[seq.length - 2])) seq.push(c); }
      const back = diff >= 6 && (level ? level % 2 === 0 : rnd.chance(0.4));
      const flash = Math.round(U.lerp(800, 470, f));
      return { diff, mode, G, seq, back, flash, title: `${MODE_NAMES.corsi} · ${len}${back ? ' · הפוך' : ''}`, extra: { m: 'c', k: len, b: back ? 1 : 0 }, par: len * (flash + 300) + 8000 + len * 1000 };
    }
    // change detection
    const n = U.clamp(Math.round(3 + diff * 0.5), 4, 8);
    const slots = rnd.sample(U.range(16), n);
    const items = slots.map(p => ({ p, shape: rnd.pick(Quick.SHAPES), color: rnd.int(0, 3) }));
    const kinds = diff < 4 ? ['shape', 'color'] : ['shape', 'color', 'move'];
    const none = diff >= 6 && rnd.chance(0.2);
    const idx = rnd.int(0, n - 1);
    const kind = rnd.pick(kinds);
    const after = items.map(it => Object.assign({}, it));
    if (!none) {
      const t = after[idx];
      if (kind === 'shape') t.shape = rnd.pick(Quick.SHAPES.filter(s => s !== t.shape));
      else if (kind === 'color') t.color = rnd.pick([0, 1, 2, 3].filter(c => c !== t.color));
      else t.p = rnd.pick(U.range(16).filter(p => !slots.includes(p)));
    }
    const ms = Math.round((1500 + n * 320) * U.lerp(1.2, 0.78, f));
    return { diff, mode, items, after, idx: none ? -1 : idx, kind: none ? 'none' : kind, noneOpt: diff >= 6, ms, title: `${MODE_NAMES.change} · ${n} צורות`, extra: { m: 'x', k: n }, par: ms + 12000 };
  }

  function grid(G, cls = '') {
    const g = h('div', { class: 'vm-grid g' + G + ' ' + cls });
    const cells = U.range(G * G).map(i => { const c = h('button', { type: 'button', class: 'vm-cell', 'aria-label': `משבצת ${i + 1}`, tabindex: '-1' }); g.appendChild(c); return c; });
    return { g, cells };
  }
  const figFor = it => Fig.render({ shape: it.shape, fill: 'solid', color: it.color }, { size: 40, cls: 'vm-fig' });

  function play(item, api) {
    const L = Kit.life(api);
    const host = api.host;
    const intro = Kit.panel(host, { kicker: 'זיכרון חזותי', title: MODE_NAMES[item.mode], cls: 'phase-intro' });
    const text = item.mode === 'pattern' ? `כמה משבצות יידלקו לרגע. זכרו איפה הן היו, ואז סמנו את כל ${item.K} המשבצות.`
      : item.mode === 'corsi' ? (item.back ? `משבצות יהבהבו אחת אחרי השנייה. הקישו עליהן בסדר הפוך: מהאחרונה לראשונה.` : 'משבצות יהבהבו אחת אחרי השנייה. הקישו עליהן באותו סדר בדיוק.')
        : `יוצגו ${item.items.length} צורות צבעוניות. אחרי הפסקה קצרה הן יחזרו, ואחת מהן תשתנה (צורה, צבע${item.diff >= 4 ? ' או מקום' : ''}). הקישו על זו שהשתנתה.${item.noneOpt ? ' לפעמים שום דבר לא משתנה.' : ''}`;
    intro.append(h('p', { class: 'ph-text' }, text),
      h('div', { class: 'phase-actions' }, UI.btn('אני מוכן/ה', { kind: 'primary', icon: 'play', onClick: () => go(), id: 'vm-start' })));
    let started = false;
    function go() {
      if (started) return; started = true;
      api.setBusy(true);
      if (item.mode === 'pattern') pattern(); else if (item.mode === 'corsi') corsi(); else change();
    }

    // ----- pattern -----
    async function pattern() {
      const b = Kit.panel(host, { kicker: 'שינון', title: 'זכרו את המשבצות הדולקות', cls: 'phase-vm' });
      const { g, cells } = grid(item.G);
      cells.forEach(c => { c.disabled = true; });
      b.appendChild(g);
      await L.wait(500);
      item.cells.forEach(i => cells[i].classList.add('lit'));
      Sound.tile(3);
      await L.wait(Math.round(item.ms * (Store.settings.memTime || 1)));
      item.cells.forEach(i => cells[i].classList.remove('lit'));
      api.setBusy(false);
      const head = b.parentNode.querySelector('.phase-title'); if (head) head.textContent = `סמנו ${item.K} משבצות`;
      const sel = new Set();
      const counter = h('span', { class: 'vm-count num' });
      const check = UI.btn('בדיקה', { kind: 'primary', icon: 'check', disabled: true, onClick: () => submit(), cls: 'grow' });
      const draw = () => { counter.textContent = `${sel.size} / ${item.K}`; check.disabled = sel.size !== item.K; cells.forEach((c, i) => c.classList.toggle('sel', sel.has(i))); };
      cells.forEach((c, i) => { c.disabled = false; c.tabIndex = 0; c.addEventListener('click', () => { if (sel.has(i)) sel.delete(i); else if (sel.size < item.K) sel.add(i); Sound.tap(); draw(); }); });
      b.appendChild(h('div', { class: 'keypad-actions' }, counter, UI.btn('נקה', { kind: 'ghost', icon: 'erase', onClick: () => { sel.clear(); draw(); } }), check));
      api.addHint({ label: 'משבצת אחת', apply() {
        const left = item.cells.filter(i => !sel.has(i));
        if (!left.length) return 'כל המשבצות שסימנתם נכונות.';
        if (sel.size >= item.K) { const wrong = Array.from(sel).find(x => !item.cells.includes(x)); if (wrong != null) sel.delete(wrong); }
        sel.add(left[0]); cells[left[0]].classList.add('hinted'); draw();
        return 'סימנו בשבילכם משבצת אחת נכונה.';
      } });
      api.startClock();
      draw();
      function submit() {
        const hits = item.cells.filter(i => sel.has(i)).length;
        cells.forEach((c, i) => { c.disabled = true; const want = item.cells.includes(i), got = sel.has(i); if (want && got) c.classList.add('ok'); else if (got) c.classList.add('bad'); else if (want) c.classList.add('miss'); });
        U.$$('.keypad-actions button', b).forEach(x => { x.disabled = true; });
        const ok = hits === item.K;
        api.done({ ok, score: hits / item.K, partial: !ok && hits >= item.K - 1, rt: U.now() - api.t0, resp: { sel: Array.from(sel) }, extra: { h: hits }, bests: ok ? { span_vis: item.K } : null, note: `${hits} מתוך ${item.K} משבצות` });
      }
    }

    // ----- corsi -----
    async function corsi() {
      const b = Kit.panel(host, { kicker: 'צפו ברצף', title: item.back ? 'זכרו את הסדר (תקלידו הפוך)' : 'זכרו את הסדר', cls: 'phase-vm' });
      const { g, cells } = grid(item.G, 'corsi');
      cells.forEach(c => { c.disabled = true; });
      b.appendChild(g);
      await L.wait(700);
      const fl = Math.round(item.flash * (Store.settings.memTime || 1));
      for (let k = 0; k < item.seq.length; k++) {
        const c = cells[item.seq[k]]; c.classList.add('lit'); Sound.tile(item.seq[k] + 2);
        await L.wait(fl); c.classList.remove('lit'); await L.wait(260);
      }
      api.setBusy(false);
      const head = b.parentNode.querySelector('.phase-title'); if (head) head.textContent = item.back ? 'עכשיו בסדר הפוך' : 'עכשיו אתם';
      const want = item.back ? item.seq.slice().reverse() : item.seq;
      const got = [];
      const dots = h('div', { class: 'vm-dots' });
      const check = UI.btn('בדיקה', { kind: 'primary', icon: 'check', disabled: true, onClick: () => submit(), cls: 'grow' });
      const draw = () => { U.clear(dots); want.forEach((_, i) => dots.appendChild(h('i', { class: i < got.length ? 'on' : '' }))); check.disabled = got.length !== want.length; cells.forEach(c => { const n = c.querySelector('.vm-n'); if (n) n.remove(); }); got.forEach((ci, k) => cells[ci].appendChild(h('span', { class: 'vm-n' }, String(k + 1)))); };
      cells.forEach((c, i) => { c.disabled = false; c.tabIndex = 0; c.addEventListener('click', () => { if (got.length >= want.length) return; got.push(i); c.classList.remove('tap'); void c.offsetWidth; c.classList.add('tap'); Sound.tile(i + 2); draw(); }); });
      b.append(dots, h('div', { class: 'keypad-actions' }, UI.btn('מחק', { kind: 'ghost', icon: 'undo', onClick: () => { got.pop(); draw(); } }), check));
      api.addHint({ label: 'המשבצת הראשונה', apply() { cells[want[0]].classList.add('hinted'); return 'המשבצת הראשונה שצריך להקיש מסומנת.'; } });
      api.startClock();
      draw();
      function submit() {
        const cmp = Kit.compareSeq(want, got);
        cells.forEach(c => { c.disabled = true; });
        U.$$('.keypad-actions button', b).forEach(x => { x.disabled = true; });
        api.done({ ok: cmp.exact, score: cmp.frac, partial: !cmp.exact && cmp.hits >= want.length - 1, rt: U.now() - api.t0, resp: { got }, extra: { h: cmp.hits }, bests: cmp.exact ? { span_corsi: want.length } : null, note: 'הסדר לא מדויק',
          explain: el => el.append(h('div', { class: 'xp-block' }, h('div', { class: 'xp-h' }, 'הסדר הנכון'), seqGrid(item, want, null)), h('div', { class: 'xp-block' }, h('div', { class: 'xp-h' }, 'מה שהקשתם'), seqGrid(item, got, want))) });
      }
    }

    // ----- change -----
    async function change() {
      const b = Kit.panel(host, { kicker: 'שינון', title: 'זכרו את הצורות ואת הצבעים', cls: 'phase-vm' });
      const { g, cells } = grid(4, 'change');
      cells.forEach(c => { c.disabled = true; });
      b.appendChild(g);
      const paint = arr => { cells.forEach(c => U.clear(c)); arr.forEach(it => cells[it.p].appendChild(figFor(it))); };
      paint(item.items);
      await L.wait(Math.round(item.ms * (Store.settings.memTime || 1)));
      cells.forEach(c => U.clear(c));
      g.classList.add('masked');
      await L.wait(900);
      g.classList.remove('masked');
      paint(item.after);
      api.setBusy(false);
      const head = b.parentNode.querySelector('.phase-title'); if (head) head.textContent = 'איזו צורה השתנתה?';
      const finish = choice => {
        cells.forEach(c => { c.disabled = true; });
        if (noneBtn) noneBtn.disabled = true;
        const ok = choice === item.idx;
        if (item.idx >= 0) cells[item.after[item.idx].p].classList.add('ok');
        if (!ok && choice >= 0) cells[item.after[choice].p].classList.add('bad');
        api.done({ ok, score: ok ? 1 : 0, rt: U.now() - api.t0, resp: { choice }, note: 'לא זו',
          explain: el => el.append(h('p', null, item.kind === 'none' ? 'שום דבר לא השתנה הפעם.' : `השתנה ${item.kind === 'shape' ? 'סוג הצורה' : item.kind === 'color' ? 'הצבע' : 'המקום'}. לפני השינוי:`), item.kind !== 'none' ? h('div', { class: 'vm-before' }, figFor(item.items[item.idx])) : null) });
      };
      item.after.forEach((it, k) => { const c = cells[it.p]; c.disabled = false; c.tabIndex = 0; c.addEventListener('click', () => finish(k)); });
      cells.forEach((c, i) => { if (!item.after.some(it => it.p === i)) c.classList.add('empty'); });
      const noneBtn = item.noneOpt ? UI.btn('שום דבר לא השתנה', { kind: 'soft', icon: 'eye', onClick: () => finish(-1) }) : null;
      if (noneBtn) b.appendChild(h('div', { class: 'phase-actions' }, noneBtn));
      if (item.kind !== 'none') api.addHint({ label: 'סוג השינוי', apply: () => `השתנה ${item.kind === 'shape' ? 'סוג הצורה' : item.kind === 'color' ? 'הצבע' : 'המקום'} של אחת הצורות.` });
      api.startClock();
    }
  }
  function seqGrid(item, arr, want) {
    const { g, cells } = grid(item.G, 'mini');
    cells.forEach(c => { c.disabled = true; });
    arr.forEach((ci, k) => { cells[ci].appendChild(h('span', { class: 'vm-n' + (want ? (want[k] === ci ? ' ok' : ' no') : '') }, String(k + 1))); cells[ci].classList.add('sel'); });
    return g;
  }
  function review(item, resp, api) {
    const b = Kit.panel(api.host, { kicker: 'זיכרון חזותי', title: MODE_NAMES[item.mode], cls: 'phase-review' });
    if (item.mode === 'pattern') {
      const { g, cells } = grid(item.G);
      const sel = new Set((resp && resp.sel) || []);
      cells.forEach((c, i) => { c.disabled = true; const w = item.cells.includes(i), s = sel.has(i); if (w && s) c.classList.add('ok'); else if (s) c.classList.add('bad'); else if (w) c.classList.add('miss'); });
      b.appendChild(g);
    } else if (item.mode === 'corsi') {
      b.appendChild(seqGrid(item, item.back ? item.seq.slice().reverse() : item.seq, null));
    } else {
      const { g, cells } = grid(4, 'change');
      cells.forEach(c => { c.disabled = true; });
      item.items.forEach(it => cells[it.p].appendChild(figFor(it)));
      b.append(h('p', { class: 'ph-text' }, 'כך נראו הצורות לפני השינוי:'), g);
    }
  }
  Games.register({
    id: 'vismem', name: 'זיכרון חזותי', en: 'Visual Memory', icon: 'vismem', group: 'speed',
    tag: 'מטריצות, רצפים ושינויים שקשה לזהות',
    concept: 'שלושה אימונים חזותיים שמתחלפים: מטריצת זיכרון (משבצות שנדלקות לרגע וצריך לשחזר), רצף קורסי (משבצות שמהבהבות לפי סדר, ולפעמים צריך להקיש אותן הפוך), וזיהוי שינוי (מה השתנה בין שתי תמונות). הלוח גדל ומספר הפריטים עולה עם הרמה.',
    why: 'הזיכרון החזותי־מרחבי הוא רכיב נפרד של זיכרון העבודה. מטריצות מאמנות את קיבולת האחסון, רצף קורסי מאמן את שימור הסדר, וזיהוי שינוי מאמן קשב לפרטים ועמידות בפני ״עיוורון לשינוי״.',
    skills: { wm: 1, spatial: 0.8, attn: 0.5 }, levels: 120, par: 25000, kind: 'custom', quick: false,
    unit: 'שלבים', make, play, review,
  });
})();

        document.removeEventListener('keydown', onKey);
        document.removeEventListener('visibilitychange', onVis);
      },
    };
  }
  App.def('timeattack', ctx => (ctx.params.run ? run(ctx) : landing(ctx)));
  return { landing, run };
})();

/* ---- main.js ---- */
/* ===== main.js : boot ===== */
'use strict';
function applyTheme() {
  const t = Store.settings.theme;
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  if (Store.settings.fontScale > 1) root.setAttribute('data-font', 'large'); else root.removeAttribute('data-font');
}
(function boot() {
  const root = document.documentElement;
  root.lang = 'he'; root.dir = 'rtl';
  applyTheme();
  Store.on(kind => { if (kind === 'settings') applyTheme(); });
  const appEl = document.getElementById('app');
  // first gesture unlocks audio
  const unlock = () => { Sound.unlock(); window.removeEventListener('pointerdown', unlock); };
  window.addEventListener('pointerdown', unlock);
  U.bidiWatch(document.body);
  // the viewer's update hook: a republish reloads the page, so remember the open screen (never a running challenge)
  const hot = (window.claude && window.claude.hot) || null;
  let started = false;
  const start = data => {
    if (started) return; started = true;
    const r = data && data.route;
    const ok = r && r.name && r.name !== 'play' && !(r.name === 'timeattack' && r.params && r.params.run);
    App.start(appEl, ok ? r : null);
    setTimeout(() => Store.Sync.init(), 400);
  };
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ route: App.route() })); } catch (e) { /* ignore */ }
  try {
    if (hot && typeof hot.ready === 'function') hot.ready(start);
    else start((hot && hot.data) || {});
  } catch (e) { start({}); }
  setTimeout(() => { if (!started) start({}); }, 1500);
})();

</script>
