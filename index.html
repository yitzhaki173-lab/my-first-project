<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>חידוד</title><meta name="description" content="אימון מוח בעברית: 18 סוגי אתגרים, קושי אדפטיבי, Time Attack ואנליטיקה"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="חידוד"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#EDEFF5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0A0E1A" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="stylesheet" href="fonts/fonts.css"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: instrument-panel shell. One reading column on phones; a centered 1040px column with 2–3 column grids on wide screens. Sticky top bar, bottom tab bar. */
:root {
  --bg: #EDEFF5;
  --bg-2: #E2E5EE;
  --surface: #FFFFFF;
  --surface-2: #F5F6FA;
  --ink: #121829;
  --ink-2: #434C69;
  --ink-3: #757D9A;
  --line: #D5D9E5;
  --line-2: #BEC4D4;
  --accent: #A85A06;
  --accent-fill: #F2A23A;
  --accent-ink: #1E1405;
  --accent-soft: #FBE9CF;
  --signal: #08808E;
  --signal-soft: #D3EEF1;
  --violet: #6B4FD3;
  --violet-soft: #E7E1FB;
  --rose: #C23A6E;
  --rose-soft: #F8DDE7;
  --good: #137A45;
  --good-soft: #D9F1E3;
  --bad: #C2323A;
  --bad-soft: #F8DEDF;
  --warn: #9A620C;
  --shadow: 0 1px 2px rgba(18, 24, 41, .06), 0 8px 22px rgba(18, 24, 41, .07);
  --shadow-lg: 0 12px 40px rgba(18, 24, 41, .18);
  --scan: rgba(18, 24, 41, .035);
  --font-display: 'Karantina', 'Secular One', 'IBM Plex Sans Hebrew', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans Hebrew', 'Rubik', 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-glitch: 'Rubik Glitch', 'Karantina', 'IBM Plex Sans Hebrew', sans-serif;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --gutter: 16px;
  --maxw: 1040px;
  --fs: 15.5px;
  --tab-h: 64px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0E1A; --bg-2: #070A13; --surface: #121929; --surface-2: #19213A; --ink: #E8ECF7; --ink-2: #A7AFCA; --ink-3: #6B7391;
    --line: #232C45; --line-2: #313B5A; --accent: #FFB547; --accent-fill: #FFB547; --accent-ink: #1E1405; --accent-soft: #3A2A12;
    --signal: #45D2DE; --signal-soft: #0E3036; --violet: #A893FF; --violet-soft: #2A2350; --rose: #FF7EAA; --rose-soft: #431B2C;
    --good: #43D68F; --good-soft: #0F3323; --bad: #FF6E6E; --bad-soft: #401A1D; --warn: #F2C14E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 26px rgba(0, 0, 0, .35); --shadow-lg: 0 16px 48px rgba(0, 0, 0, .55); --scan: rgba(255, 255, 255, .025);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0E1A; --bg-2: #070A13; --surface: #121929; --surface-2: #19213A; --ink: #E8ECF7; --ink-2: #A7AFCA; --ink-3: #6B7391;
  --line: #232C45; --line-2: #313B5A; --accent: #FFB547; --accent-fill: #FFB547; --accent-ink: #1E1405; --accent-soft: #3A2A12;
  --signal: #45D2DE; --signal-soft: #0E3036; --violet: #A893FF; --violet-soft: #2A2350; --rose: #FF7EAA; --rose-soft: #431B2C;
  --good: #43D68F; --good-soft: #0F3323; --bad: #FF6E6E; --bad-soft: #401A1D; --warn: #F2C14E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 26px rgba(0, 0, 0, .35); --shadow-lg: 0 16px 48px rgba(0, 0, 0, .55); --scan: rgba(255, 255, 255, .025);
  color-scheme: dark;
}
:root[data-font="large"] { --fs: 17.5px; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs); line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}
body::before { /* faint instrument grid */
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--scan) 1px, transparent 1px), linear-gradient(90deg, var(--scan) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: linear-gradient(180deg, #000 0, transparent 420px);
  -webkit-mask-image: linear-gradient(180deg, #000 0, transparent 420px);
}
#app { position: relative; z-index: 1; min-height: 100%; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--signal); outline-offset: 2px; border-radius: 6px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.ic { flex: none; display: block; }
[hidden] { display: none !important; }
small { font-size: .82em; color: var(--ink-3); }
b, strong { font-weight: 600; }

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: var(--maxw); margin: 0 auto; padding: 8px var(--gutter); display: flex; align-items: center; gap: 10px; min-height: 56px; }
.top-title { flex: 1; min-width: 0; font-weight: 600; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-title .tt { display: inline-flex; align-items: center; gap: 6px; }
.top-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.icon-btn {
  appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink-2);
  width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center; cursor: pointer; flex: none;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:active { transform: scale(.96); }
.view { position: relative; max-width: var(--maxw); margin: 0 auto; padding: 18px var(--gutter) calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px)); outline: none; }
body.playing .view { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.view.enter { animation: viewIn .32s var(--ease); }
.view.enter-back { animation: viewBack .28s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@keyframes viewBack { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--line);
}
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); }
.tab { appearance: none; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: .74rem; font-weight: 500; position: relative; padding: 0 2px; }
.tab span { white-space: nowrap; }
.tab.on { color: var(--ink); }
.tab.on::before { content: ''; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent-fill); }
.tab:hover { color: var(--ink-2); }

/* ---------- primitives ---------- */
.btn {
  appearance: none; border: 1px solid transparent; border-radius: 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; min-height: 44px; font-weight: 600; font-size: .95rem; line-height: 1.2;
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s, opacity .15s; user-select: none;
}
.btn:active:not(:disabled) { transform: translateY(1px) scale(.985); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn-primary { background: var(--accent-fill); color: var(--accent-ink); box-shadow: 0 1px 0 rgba(0, 0, 0, .08), 0 6px 16px color-mix(in srgb, var(--accent-fill) 30%, transparent); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.04); }
.btn-soft { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn-soft:hover:not(:disabled) { border-color: var(--line-2); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--bad); color: #fff; }
.btn-lg { min-height: 54px; padding: 12px 22px; font-size: 1.05rem; border-radius: 14px; }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: .85rem; border-radius: 10px; }
.btn.grow { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.hot { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.cool { color: var(--signal); background: var(--signal-soft); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill-focus { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
.stars { display: inline-flex; gap: 1px; }
.stars .st { color: var(--line-2); display: inline-flex; }
.stars .st.on { color: var(--accent-fill); }
.stars .st.on svg { fill: currentColor; }
.ring-wrap { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring-wrap svg { position: absolute; inset: 0; }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--accent-fill); transition: stroke-dasharray .6s var(--ease); }
.ring.cool .ring-fg { stroke: var(--signal); }
.ring-inner { position: relative; text-align: center; line-height: 1.1; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent-fill); border-radius: 99px; transition: width .5s var(--ease); }
.bar.cool .bar-fill { background: var(--signal); }
.sec { margin-top: 26px; }
.sec-title { font-family: var(--font-display); font-weight: 400; font-size: 2rem; letter-spacing: .01em; line-height: 1; margin-bottom: 12px; }
.empty { display: grid; place-items: center; gap: 8px; text-align: center; color: var(--ink-3); padding: 28px 12px; }
.kicker { font-size: .78rem; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow-lg); transition: opacity .2s, transform .25s var(--ease); max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast span { display: inline-flex; align-items: center; gap: 6px; }
.toast.gold { background: var(--accent-fill); color: var(--accent-ink); }
.toast.bad { background: var(--bad); color: #fff; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(5, 8, 16, .45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s; padding: 0 0 env(safe-area-inset-bottom, 0px); }
.sheet-wrap.show { opacity: 1; }
.sheet { background: var(--surface); width: min(560px, 100%); border-radius: 20px 20px 0 0; padding: 20px var(--gutter) 22px; box-shadow: var(--shadow-lg); transform: translateY(24px); transition: transform .25s var(--ease); max-height: 88vh; overflow: auto; }
.sheet-wrap.show .sheet { transform: none; }
.sheet h3 { font-size: 1.15rem; margin-bottom: 8px; }
.sheet p { color: var(--ink-2); margin-bottom: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet-actions .btn { flex: 1; }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 20px; } }

/* timer bar */
.tbar { position: relative; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-bottom: 12px; }
.tbar-fill { position: absolute; inset: 0; background: var(--signal); transform-origin: right center; }
[dir="rtl"] .tbar-fill { transform-origin: right center; }
.tbar.low .tbar-fill { background: var(--bad); }
.tbar-txt { position: absolute; inset-inline-start: 6px; top: -1px; font-size: 0; }

/* keypad */
.keypad-wrap { display: grid; gap: 10px; }
.keypad { display: grid; gap: 8px; }
.key { appearance: none; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 1px 0 var(--line); font-size: 1.15rem; font-weight: 600; cursor: pointer; display: grid; place-items: center; transition: transform .08s, background .12s; padding: 4px; }
.keypad.mono .key { font-family: var(--font-mono); }
.key:hover { background: var(--surface-2); }
.key:active { transform: scale(.95); background: var(--accent-soft); }
.keypad-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* burst */
.burst { position: fixed; z-index: 95; pointer-events: none; width: 0; height: 0; }
.burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; background: var(--accent-fill); animation: burst .8s var(--ease) forwards; }
.burst i[style*="--hue: 1"] { background: var(--signal); }
.burst i[style*="--hue: 2"] { background: var(--violet); }
@keyframes burst { from { transform: translate(0, 0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.4) rotate(160deg); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- play screen ---------- */
.play { display: grid; gap: 14px; max-width: 760px; margin: 0 auto; }
.play.flash-in .item-host { animation: itemIn .35s var(--ease); }
@keyframes itemIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.play-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ph-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.ph-type { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.ph-level { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; letter-spacing: .02em; }
.ph-level small { font-family: var(--font-body); font-size: .8rem; }
.ph-sub { color: var(--ink-3); font-size: .85rem; }
.ph-side { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: .78rem; }
.pips { display: inline-flex; gap: 3px; direction: ltr; }
.pips i { width: 7px; height: 14px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--accent-fill); }
.play-prog { display: flex; gap: 4px; }
.play-prog i { flex: 1; height: 5px; border-radius: 99px; background: var(--line); }
.play-prog i.ok { background: var(--good); }
.play-prog i.no { background: var(--bad); }
.play-prog i.skip { background: var(--line-2); }
.play-prog i.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink-3); }
.item-host { min-height: 120px; }
.hint-box { display: grid; gap: 8px; }
.hint { display: flex; gap: 8px; align-items: flex-start; background: var(--accent-soft); color: var(--ink); border-radius: var(--r); padding: 10px 12px; font-size: .93rem; }
.hint .ic { color: var(--accent); margin-top: 3px; }
.hint.pop { animation: pop .3s var(--ease); }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.play-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
  display: flex; gap: 8px; align-items: center; justify-content: space-between;
  padding: 10px max(var(--gutter), calc((100vw - 760px) / 2)) calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.play-bar .pb-gap { flex: 1; }
.play-bar .pb-next { min-width: 140px; }
@media (max-width: 420px) { .play-bar .btn { padding: 10px 11px; } .play-bar .pb-next { min-width: 120px; } }

/* ---------- multiple choice ---------- */
.mcq { display: grid; gap: 14px; }
.prompt { font-size: 1.12rem; line-height: 1.65; }
.prompt.big { font-size: 1.3rem; }
.prompt p + p { margin-top: 8px; }
.prompt .story { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow); font-size: 1.02rem; }
.question { font-weight: 600; font-size: 1.05rem; }
.opts { display: grid; gap: 10px; }
.opts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts-grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts-grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 520px) { .opts-grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt {
  appearance: none; text-align: start; cursor: pointer; width: 100%;
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 54px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; box-shadow: 0 1px 0 var(--line);
  transition: border-color .15s, background .15s, transform .1s, opacity .2s; font-size: 1rem; line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--line-2); background: var(--surface-2); }
.opt:active:not(:disabled) { transform: scale(.99); }
.opt-key { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: .85rem; color: var(--ink-2); }
.opt-body { flex: 1; min-width: 0; }
.opt-body svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.opts-grid .opt, .opts-grid3 .opt, .opts-grid4 .opt { flex-direction: column; align-items: stretch; gap: 6px; padding: 10px; }
.opts-grid .opt-key, .opts-grid3 .opt-key, .opts-grid4 .opt-key { width: 24px; height: 24px; font-size: .78rem; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .opt-key { background: var(--good); color: #fff; border-color: transparent; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.opt.wrong .opt-key { background: var(--bad); color: #fff; border-color: transparent; }
.opt.dim { opacity: .55; }
.opt.gone { opacity: .25; text-decoration: line-through; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

/* ---------- feedback ---------- */
.feedback { border-radius: var(--r-lg); padding: 14px 16px; border: 1.5px solid var(--line); background: var(--surface); display: grid; gap: 10px; }
.feedback.pop { animation: pop .3s var(--ease); }
.fb-ok { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.fb-no { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.fb-part { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.fb-top { display: flex; align-items: center; gap: 12px; }
.fb-badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: #fff; }
.fb-ok .fb-badge { background: var(--good); }
.fb-no .fb-badge { background: var(--bad); }
.fb-part .fb-badge { background: var(--warn); }
.fb-title { flex: 1; display: grid; }
.fb-title strong { font-size: 1.12rem; }
.fb-meta { color: var(--ink-3); font-size: .82rem; }
.fb-explain { color: var(--ink-2); font-size: .97rem; line-height: 1.7; border-top: 1px dashed var(--line); padding-top: 10px; }
.fb-explain b { color: var(--ink); }

/* ---------- summary ---------- */
.summary { display: grid; gap: 16px; max-width: 760px; margin: 0 auto; }
.sum-hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 0; }
.sum-ring-in strong { display: block; font-family: var(--font-display); font-size: 2.6rem; font-weight: 400; line-height: .95; }
.sum-ring-in span { font-size: .8rem; color: var(--ink-3); }
.sum-stats { display: grid; gap: 8px; min-width: 200px; }
.stat { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.stat span { color: var(--ink-3); }
.stat strong { font-variant-numeric: tabular-nums; }
.card h3 { font-size: 1rem; margin-bottom: 10px; }
.delta-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.delta-row:last-child { border-bottom: 0; }
.dr-name { flex: 1; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.dr-val { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; direction: ltr; }
.dr-ch { font-size: .8rem; color: var(--ink-3); min-width: 48px; text-align: end; }
.dr-ch.up { color: var(--good); }
.dr-ch.down { color: var(--bad); }
.badge-row { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.badge-row small { display: block; }
.badge-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.sum-items { display: flex; flex-wrap: wrap; gap: 6px; }
.sum-item { appearance: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 6px 9px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-variant-numeric: tabular-nums; font-size: .85rem; }
.sum-item.ok { color: var(--good); }
.sum-item.no { color: var(--bad); }
.sum-item.skip { color: var(--ink-3); }
.sum-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sum-actions .btn { flex: 1; min-width: 160px; }

/* ---------- brand ---------- */
.brand { display: inline-flex; align-items: center; gap: 9px; }
.brand-name { font-family: var(--font-display); font-size: 1.85rem; font-weight: 400; letter-spacing: .02em; line-height: 1; }
.logo-bg { fill: var(--ink); }
.logo-wave { stroke: var(--accent-fill); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lvl-chip { cursor: pointer; gap: 6px; }
.lvl-chip span { color: var(--ink-3); font-weight: 500; }

/* tones per group */
.tone-amber { --tone: var(--accent); --tone-fill: var(--accent-fill); --tone-soft: var(--accent-soft); }
.tone-cyan { --tone: var(--signal); --tone-fill: var(--signal); --tone-soft: var(--signal-soft); }
.tone-violet { --tone: var(--violet); --tone-fill: var(--violet); --tone-soft: var(--violet-soft); }
.tone-rose { --tone: var(--rose); --tone-fill: var(--rose); --tone-soft: var(--rose-soft); }

/* ---------- home ---------- */
.hero {
  position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px; box-shadow: var(--shadow);
}
.hero-trace { position: absolute; inset: auto 0 0 0; height: 70px; opacity: .9; pointer-events: none; }
.trace { width: 100%; height: 100%; display: block; }
.trace-line { stroke: var(--signal); stroke-width: 2; opacity: .55; vector-effect: non-scaling-stroke; }
.trace-dot { fill: var(--signal); }
.hero-main { position: relative; display: grid; gap: 8px; padding-bottom: 34px; min-width: 0; }
.hero-kicker { color: var(--ink-3); font-size: .85rem; }
.hero-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 7vw, 3.4rem); line-height: .95; letter-spacing: .01em; }
.hero-sub { color: var(--ink-2); max-width: 46ch; }
.focus-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.focus-label { font-size: .78rem; color: var(--ink-3); font-weight: 600; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.hero-ring { position: relative; display: grid; justify-items: center; gap: 6px; padding-bottom: 34px; }
.hr-in strong { display: block; font-family: var(--font-display); font-size: 2.4rem; font-weight: 400; line-height: .9; }
.hr-in span { font-size: .75rem; color: var(--ink-3); }
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; padding: 18px 16px; }
  .hero-ring { position: absolute; top: 14px; inset-inline-end: 12px; padding: 0; }
  .hero-ring .ring-wrap { transform: scale(.72); transform-origin: top left; }
  .hero-ring small { display: none; }
  .hero-kicker, .hero-title { padding-inline-end: 84px; }
  .hero-actions .btn { flex: 1; }
  .hero-actions .btn-lg { padding-inline: 12px; white-space: nowrap; }
}
.quick-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 14px; }
.qcard {
  appearance: none; text-align: start; cursor: pointer; display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; transition: border-color .15s, transform .12s;
}
.qcard:hover { border-color: var(--line-2); }
.qcard:active { transform: scale(.99); }
.qc-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); flex: none; }
.qc-txt { flex: 1; display: grid; min-width: 0; line-height: 1.35; }
.qc-txt strong { font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qc-meta { font-size: .8rem; color: var(--ink-3); }
.qc-go { color: var(--ink-3); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head .sec-title { margin: 0; }
.sec-desc { color: var(--ink-3); font-size: .88rem; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 10px; }
@media (max-width: 520px) { .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cat-card {
  appearance: none; text-align: start; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; min-height: 168px;
  transition: border-color .15s, transform .12s, box-shadow .15s; position: relative; overflow: hidden;
}
.cat-card::after { content: ''; position: absolute; inset: 0 0 auto auto; width: 64px; height: 64px; background: radial-gradient(circle at top left, var(--tone-soft), transparent 70%); pointer-events: none; transform: scaleX(-1); }
.cat-card:hover { border-color: color-mix(in srgb, var(--tone) 45%, var(--line)); box-shadow: var(--shadow); }
.cat-card:active { transform: scale(.985); }
.cc-top { display: flex; align-items: center; justify-content: space-between; }
.cc-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); }
.cc-level b { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; color: var(--tone); }
.cc-new { font-size: .72rem; font-weight: 600; color: var(--tone); background: var(--tone-soft); padding: 2px 8px; border-radius: 99px; }
.cc-name { font-weight: 700; font-size: 1.04rem; line-height: 1.3; margin-top: 4px; }
.cc-tag { color: var(--ink-3); font-size: .83rem; line-height: 1.45; flex: 1; }
.cc-foot { display: flex; align-items: center; gap: 8px; font-size: .75rem; color: var(--ink-3); }
.cc-foot .bar { flex: 1; height: 5px; }
.cc-foot .bar-fill { background: var(--tone-fill); }
.home-foot { margin-top: 30px; text-align: center; color: var(--ink-3); font-size: .82rem; display: grid; gap: 4px; }
.sync-line { display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.sync-line.s-on { color: var(--good); }

/* ---------- category ---------- */
.cat-hero { display: flex; gap: 16px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); }
.ch-ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); flex: none; }
.ch-txt { display: grid; gap: 8px; min-width: 0; }
.ch-en { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; color: var(--tone); text-transform: uppercase; }
.ch-name { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 8vw, 3.2rem); line-height: .95; }
.ch-concept { color: var(--ink-2); max-width: 62ch; }
.ch-why summary { cursor: pointer; font-weight: 600; color: var(--tone); }
.ch-why p { color: var(--ink-2); margin-top: 6px; max-width: 62ch; }
.ch-skills { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 520px) { .cat-hero { flex-direction: column; } }
.cat-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 560px) { .cat-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; }
.sb-l { font-size: .78rem; color: var(--ink-3); }
.sb-v { font-size: 1.35rem; font-weight: 700; }
.cat-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.cat-actions .btn { flex: 1; min-width: 200px; }
.cat-note { color: var(--ink-3); font-size: .85rem; margin-top: 10px; }
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 7px; }
.lv-band { grid-column: 1 / -1; font-size: .78rem; font-weight: 600; color: var(--ink-3); margin-top: 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.lv-band:first-child { margin-top: 0; }
.lv { appearance: none; cursor: pointer; aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; align-content: center; gap: 0; transition: transform .1s, border-color .15s; padding: 2px; }
.lv:hover { border-color: var(--line-2); }
.lv:active { transform: scale(.94); }
.lv-n { font-weight: 600; font-size: .95rem; }
.lv-st { font-size: .6rem; letter-spacing: -1px; color: var(--accent-fill); line-height: 1; }
.lv.done { background: var(--accent-soft); border-color: transparent; }
.lv.tried { border-style: dashed; border-color: var(--bad); }
.lv.next { box-shadow: 0 0 0 2px var(--accent-fill); }

/* ---------- shared game palette (stimulus colors, validated against both surfaces) ---------- */
:root {
  --k-red: #D63939; --k-orange: #DD7410; --k-yellow: #C99700; --k-green: #2B9348; --k-blue: #1F73D1; --k-purple: #6D46D9; --k-pink: #C9356F; --k-teal: #0A8496;
  --stage: #141A2C; --stage-ink: #EEF1FA; --stage-line: #2A3350;
  --s-red: #FF6B6B; --s-blue: #4DABF7; --s-green: #51CF66; --s-yellow: #FFD43B; --s-purple: #B197FC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --k-red: #FF6B6B; --k-orange: #FFA94D; --k-yellow: #FFD43B; --k-green: #51CF66; --k-blue: #4DABF7; --k-purple: #9775FA; --k-pink: #F06595; --k-teal: #3BC9DB; --stage: #0B1020; --stage-line: #232C45; }
}
:root[data-theme="dark"] { --k-red: #FF6B6B; --k-orange: #FFA94D; --k-yellow: #FFD43B; --k-green: #51CF66; --k-blue: #4DABF7; --k-purple: #9775FA; --k-pink: #F06595; --k-teal: #3BC9DB; --stage: #0B1020; --stage-line: #232C45; }

.muted { color: var(--ink-3); }
.muted-q { color: var(--ink-2); font-size: .98rem; margin-bottom: 10px; }
.prompt .muted-q { font-size: 1rem; }
.prompt ul.rules, .fb-explain ul.rules { margin: 6px 0 0; padding-inline-start: 20px; }

/* ---------- phases (multi-step games) ---------- */
.phase { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; animation: itemIn .3s var(--ease); }
.phase-head { display: grid; gap: 2px; }
.phase-kicker { font-size: .78rem; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
.phase-title { font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
.ph-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.ph-text { color: var(--ink-2); font-size: 1rem; line-height: 1.7; max-width: 62ch; }
.ph-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.phase-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.phase-intro .phase-actions .btn { min-width: 200px; }
@media (max-width: 520px) { .phase-intro .phase-actions .btn { flex: 1; } }
.phase-mem .ph-body { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.mem-timer { margin: 0; }
.mem-content { display: grid; justify-items: center; gap: 10px; padding: 8px 0; }
.phase-review .ph-body { background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: var(--r-lg); padding: 14px; }

/* countdown */
.phase-count .ph-body { min-height: 220px; display: grid; place-items: center; align-content: center; gap: 6px; }
.count-label { color: var(--ink-3); font-weight: 600; }
.count-num { font-family: var(--font-display); font-size: 6rem; line-height: 1; color: var(--accent); }
.count-num.pulse { animation: cPulse .6s var(--ease); }
@keyframes cPulse { from { transform: scale(1.5); opacity: 0; } to { transform: none; opacity: 1; } }

/* glitch transition */
.glitch-fx { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 2px, transparent 2px 4px), color-mix(in srgb, var(--bg) 70%, transparent);
  animation: glFx .75s steps(6) forwards; }
.gl-txt { position: relative; font-family: var(--font-glitch); font-size: clamp(2.2rem, 9vw, 4.2rem); color: var(--ink); text-shadow: 3px 0 var(--k-red), -3px 0 var(--k-teal); animation: glTxt .25s steps(2) infinite; }
@keyframes glFx { 0% { opacity: 0; } 10% { opacity: 1; } 40% { clip-path: inset(10% 0 30% 0); } 60% { clip-path: inset(40% 0 10% 0); } 80% { opacity: 1; clip-path: none; } 100% { opacity: 0; } }
@keyframes glTxt { 0% { transform: translate(2px, -1px) skewX(-6deg); } 50% { transform: translate(-3px, 1px) skewX(4deg); } 100% { transform: none; } }
body.shake .view { animation: bShake .5s; }
@keyframes bShake { 15%, 55% { transform: translateX(-6px); } 35%, 75% { transform: translateX(6px); } }

/* xp (explanations inside feedback) */
.xp-block { display: grid; gap: 8px; margin-top: 4px; }
.xp-h { font-weight: 600; color: var(--ink); font-size: .92rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.xp-int { border-inline-start: 3px solid var(--line-2); padding-inline-start: 10px; }
.xp-int.ok { border-color: var(--good); }
.xp-int.no { border-color: var(--bad); }
.xp-int .ic { color: inherit; }
.xp-sum { font-weight: 600; color: var(--ink); }

/* ---------- memory tiles and tokens ---------- */
.mem-tiles { display: grid; grid-template-columns: repeat(var(--cw, 8), auto); justify-content: center; gap: 8px; }
@media (max-width: 520px) { .mem-tiles { grid-template-columns: repeat(var(--cn, 5), auto); } }
.mt { display: grid; justify-items: center; gap: 2px; min-width: 52px; padding: 8px 6px 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.mt small { font-size: .68rem; }
.mono-t { font-family: var(--font-mono); font-weight: 600; font-size: 1.15rem; letter-spacing: .02em; }
.mem-tiles .mono-t, .mem-tiles .heb-t { font-size: 1.9rem; line-height: 1.15; }
.set-cmds .mono-t, .set-code .mono-t { font-size: 1.15rem !important; padding: 6px 2px; }
.heb-t { font-weight: 700; font-size: 1.2rem; }
.cdot { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 2px solid color-mix(in srgb, #000 18%, transparent); }
.cdot i { font-style: normal; font-size: .7rem; font-weight: 700; color: rgba(0, 0, 0, .55); }
.mem-tiles .cdot { width: 44px; height: 44px; }
.cdot.c0 { background: var(--k-red); } .cdot.c1 { background: var(--k-orange); } .cdot.c2 { background: var(--k-yellow); }
.cdot.c3 { background: var(--k-green); } .cdot.c4 { background: var(--k-blue); } .cdot.c5 { background: var(--k-purple); }
.tok-fig { color: var(--ink); }
.tok-fig .fig-c0 { color: var(--ink); }

/* recall input */
.recall { display: grid; gap: 12px; }
.recall-label { color: var(--ink-2); font-weight: 600; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.slot { appearance: none; position: relative; width: 52px; height: 58px; border-radius: 12px; border: 1.5px dashed var(--line-2); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.slot.filled { border-style: solid; border-color: var(--line-2); background: var(--surface-2); }
.slot.cur { border-color: var(--accent-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-fill) 25%, transparent); }
.slot-v { display: grid; place-items: center; min-height: 30px; }
.slot-v .mono-t { font-size: 1.2rem; }
.slot-v .fig { width: 26px; height: 26px; }
.slot-v .cdot { width: 26px; height: 26px; }
.slot-i { position: absolute; bottom: 1px; inset-inline-end: 5px; font-size: .62rem; }
.tokpad { display: grid; gap: 8px; }
.tok { appearance: none; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 1px 0 var(--line); cursor: pointer; display: grid; place-items: center; padding: 6px; transition: transform .08s, background .12s; }
.tok:hover { background: var(--surface-2); }
.tok:active { transform: scale(.95); }
.tok .fig { width: 30px; height: 30px; }
.recall.locked { opacity: .7; }
.seq-show { display: flex; flex-wrap: wrap; gap: 6px; }
.sq-t { display: grid; justify-items: center; gap: 1px; min-width: 40px; padding: 5px 6px 2px; border-radius: 10px; background: var(--surface-2); border: 1.5px solid var(--line); }
.sq-t small { font-size: .6rem; }
.sq-t.ok { border-color: var(--good); background: var(--good-soft); }
.sq-t.no { border-color: var(--bad); background: var(--bad-soft); }
.sq-t .fig { width: 24px; height: 24px; }
.sq-t .cdot { width: 24px; height: 24px; }

/* number entry */
.num-entry { display: grid; gap: 10px; max-width: 360px; width: 100%; margin: 0 auto; }
.num-disp { display: flex; align-items: center; justify-content: center; min-height: 64px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line-2); font-family: var(--font-mono); font-size: 2.1rem; font-weight: 600; letter-spacing: .06em; }
.nd-caret { width: 2px; height: 1.1em; background: var(--accent-fill); margin-inline-start: 3px; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.num-entry.locked .nd-caret { display: none; }
.num-entry.locked { opacity: .75; }
.key.blank { visibility: hidden; }

/* flash (memorize-first) */
.flash-box { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow); }
.flash-box.review { background: var(--surface-2); box-shadow: none; border-style: dashed; }
.flash-label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); font-size: .9rem; }
.flash-content { display: grid; justify-items: center; }
.flash-timer { margin: 0; }

/* ---------- figures ---------- */
.fig { display: block; }
.fig-c0 { color: var(--ink); }
.fig-c1 { color: var(--k-orange); }
.fig-c2 { color: var(--k-teal); }
.fig-c3 { color: var(--k-pink); }
.fig-mark { fill: var(--accent-fill); stroke: var(--surface); stroke-width: 2; }
.fig-guide { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 3; }
.fig-line { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
.poly-cell { fill: var(--signal); stroke: var(--surface); stroke-width: 1; }
.poly-cell.head { fill: var(--accent-fill); }

/* sequences */
.seq-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seq-tile { min-width: 54px; height: 58px; padding: 0 10px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-family: var(--font-mono); font-size: 1.45rem; font-weight: 600; }
.seq-tile.long { font-size: 1.1rem; }
.seq-tile.q { border-style: dashed; border-color: var(--accent-fill); color: var(--accent); background: var(--accent-soft); }
.seq-row.heb .seq-tile { font-family: var(--font-body); }
.heb-opt { font-weight: 700; font-size: 1.25rem; }
.opts .mono { font-size: 1.15rem; font-weight: 600; }

/* shape analogies */
.an-board { display: grid; gap: 8px; justify-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow); }
.an-row { display: flex; align-items: center; gap: 10px; }
.an-cell { position: relative; width: 104px; height: 104px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }

/* matrices */

.mx-cell { aspect-ratio: 1; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; }

.mx-cell.q span { font-family: var(--font-display); font-size: 2.6rem; color: var(--accent); }

/* mental rotation */
.rot-pair { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.rot-box { display: grid; justify-items: center; gap: 4px; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.rot-box span { font-size: .8rem; color: var(--ink-3); font-weight: 600; }
.rot-box.ref { border-color: color-mix(in srgb, var(--signal) 45%, var(--line)); }
.rot-pair.small .rot-box { box-shadow: none; padding: 6px; }
.rot-ref { display: grid; place-items: center; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: fit-content; margin: 0 auto; box-shadow: var(--shadow); }
@media (max-width: 420px) { .rot-box svg { width: 128px; height: 128px; } }

/* deduction stories */
.story .say { padding-inline-start: 10px; border-inline-start: 3px solid var(--line-2); margin-top: 8px; }
.quote { color: var(--ink); }
.clues { margin: 8px 0 0; padding-inline-start: 22px; display: grid; gap: 4px; }
.syll .concl { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--violet-soft); }
.kk { display: inline-block; padding: 1px 7px; border-radius: 7px; margin: 2px; font-size: .9rem; }
.kk.k { background: var(--good-soft); }
.kk.l { background: var(--bad-soft); }

/* verbal */
.prompt.vb { font-size: 1.1rem; }
.vb-pair, .vb-rat { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
.vb-w { display: inline-block; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-weight: 700; font-size: 1.2rem; }
.vb-sep { font-size: 1.4rem; color: var(--ink-3); font-weight: 700; }
.vb-eq { font-size: 1.1rem; color: var(--accent); font-weight: 700; padding: 0 4px; }
.vb-q { border-style: dashed; border-color: var(--accent-fill); color: var(--accent); background: var(--accent-soft); }

/* ---------- system glitch ---------- */
.phase-int .mcq { gap: 10px; }
.phase-int .prompt { font-size: 1.15rem; }
.phase-twist .ph-body { background: var(--bad-soft); border-radius: var(--r-lg); padding: 16px; }

/* ---------- dual task ---------- */
.pads { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 360px; width: 100%; margin: 0 auto; }
.pads.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 260px; }
.pads.mini { max-width: 200px; gap: 6px; }
.pads.mini .pad { min-height: 40px; border-radius: 10px; }
.pad { appearance: none; min-height: 78px; border-radius: 16px; border: 2px solid transparent; display: grid; place-items: center; cursor: default; font-weight: 700; color: rgba(255, 255, 255, .92); font-size: 1.05rem; transition: transform .12s, filter .12s, box-shadow .12s; filter: saturate(.45) brightness(.92); opacity: .62; }
button.pad { cursor: pointer; }
.pad.lit { opacity: 1; filter: none; transform: scale(1.05); box-shadow: 0 0 0 4px var(--surface), 0 0 26px currentColor; }
.pd0 { background: var(--k-red); color: var(--k-red); } .pd1 { background: var(--k-blue); color: var(--k-blue); } .pd2 { background: var(--k-green); color: var(--k-green); }
.pd3 { background: var(--k-orange); color: var(--k-orange); } .pd4 { background: var(--k-purple); color: var(--k-purple); } .pd5 { background: var(--k-teal); color: var(--k-teal); }
.pad span { color: rgba(255, 255, 255, .95); text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.dgrid { display: grid; gap: 6px; width: min(300px, 100%); margin: 0 auto; }

.dgrid.g4 { grid-template-columns: repeat(4, 1fr); }
.dgrid.mini { width: 120px; gap: 3px; }
.dcell { appearance: none; aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0; position: relative; transition: background .1s; }
.dgrid.mini .dcell { border-radius: 4px; }
.dcell.lit { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 18px color-mix(in srgb, var(--signal) 60%, transparent); }

.dual-stim { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }

.tf-card.ok { border-color: var(--good); }

.tf-timer { margin: 0; height: 5px; }
.tf-text { font-size: 1.12rem; font-weight: 600; line-height: 1.5; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tf-yes .ic { color: var(--good); }
.tf-no .ic { color: var(--bad); }
.pad-dot { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: #fff !important; font-weight: 700; font-size: .78rem; }
.mini-cell rect { fill: var(--line-2); }
.mini-cell rect.on { fill: var(--signal); }
.pad-tok { display: grid; place-items: center; width: 100%; min-height: 40px; border-radius: 10px; color: #fff !important; font-weight: 700; }
.rc-pads .tokpad { max-width: 360px; width: 100%; margin: 0 auto; }
.rc-grid .tokpad { max-width: 280px; width: 100%; margin: 0 auto; gap: 6px; }
.rc-grid .tok { aspect-ratio: 1; min-height: 0; padding: 0; }

.rc-grid .tok:active .cell-tok { background: var(--signal); }
.tf-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tf-list li { padding: 6px 10px; border-radius: 10px; background: var(--surface-2); font-size: .92rem; }
.tf-list li.ok .ic { color: var(--good); display: inline; vertical-align: -2px; }
.tf-list li.no { background: var(--bad-soft); }
.tf-list li.no .ic { color: var(--bad); display: inline; vertical-align: -2px; }

/* ---------- escape rooms ---------- */
.esc-intro .ph-text { font-size: 1.02rem; }
.insc { display: grid; gap: 10px; width: min(440px, 100%); padding: 16px; border-radius: 16px; background: var(--stage); color: var(--stage-ink); border: 1px solid var(--stage-line); box-shadow: inset 0 0 40px rgba(0, 0, 0, .35); }

.esc-map { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.esc-seq b { color: var(--accent); }

.esc-word { font-size: 1.25rem; color: var(--accent); }
.gem-table { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; margin-top: 4px; }
.gem-table span { display: grid; justify-items: center; padding: 3px 2px; border-radius: 8px; background: var(--surface-2); font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.door-signs { display: grid; gap: 8px; margin-top: 4px; }
.door-sign { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.ds-door { flex: none; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: .85rem; }

.esc-status { min-height: 24px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.esc-status.ok { color: var(--good); }
.esc-status.bad { color: var(--bad); }

.xp-gate { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--surface-2); margin-top: 6px; }
.xp-gate summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.xp-gate.ok summary { color: var(--good); }

.xp-gate.no summary { color: var(--bad); }
.xp-gq { margin-top: 8px; color: var(--ink-2); font-size: .93rem; }
.xp-gq .gem-table { display: none; }

/* ---------- signal to noise ---------- */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.rep-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: .85rem; letter-spacing: .02em; color: var(--ink-2); }

.rep-body { padding: 10px 12px 14px; line-height: 2.05; font-size: 1.04rem; }
.sent { appearance: none; display: inline; background: none; border: 0; padding: 2px 3px; margin: 0; border-radius: 6px; font: inherit; color: inherit; text-align: start; cursor: pointer; line-height: inherit; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background .12s; }
button.sent:hover { background: var(--surface-2); }
.sent.sel { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent-fill); }
.sent.conf { background: var(--good-soft); box-shadow: inset 0 -2px 0 var(--good); }
.sent.wrongpick { background: var(--bad-soft); box-shadow: inset 0 -2px 0 var(--bad); }
.sent-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: .66rem; font-weight: 700; color: var(--ink-3); margin-inline-end: 4px; vertical-align: 2px; }

/* ---------- reverse engineering ---------- */
.rv { display: grid; gap: 12px; }
.rv-ends { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.rv-end { display: grid; justify-items: center; gap: 6px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 120px; }
.rv-el { font-size: .74rem; font-weight: 700; letter-spacing: .05em; color: var(--ink-3); }

@media (max-width: 560px) {
  .rv-ends:has(.rv-arr:not(.sm)), .rv-ends:has(.rv-word:not(.sm)) { flex-direction: column; gap: 4px; }
  .rv-ends:has(.rv-arr:not(.sm)) .rv-big-arrow, .rv-ends:has(.rv-word:not(.sm)) .rv-big-arrow { transform: rotate(-90deg); line-height: 1; }
}
.rv-ask { color: var(--ink-2); font-weight: 600; text-align: center; }
.rv-num { font-family: var(--font-mono); font-weight: 600; font-size: 2rem; line-height: 1.1; }
.rv-num.sm { font-size: 1.15rem; }
.rv-grid { display: block; }
.rv-cell { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1; }
.rv-cell.on { fill: var(--signal); stroke: var(--signal); }
.rv-arr { display: inline-flex; gap: 4px; }
.rv-t { font-style: normal; display: grid; place-items: center; width: 34px; height: 38px; border-radius: 9px; font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; color: #fff; }
.rv-arr.sm .rv-t { width: 24px; height: 28px; font-size: .85rem; border-radius: 7px; }
.rv-t.t1 { background: var(--k-red); } .rv-t.t2 { background: var(--k-blue); } .rv-t.t3 { background: var(--k-green); }
.rv-t.t4 { background: var(--k-orange); } .rv-t.t5 { background: var(--k-purple); } .rv-t.t6 { background: var(--k-teal); }
.rv-word { display: inline-flex; gap: 3px; }
.rv-l { font-style: normal; display: grid; place-items: center; width: 36px; height: 40px; border-radius: 9px; background: var(--surface-2); border: 1.5px solid var(--line-2); font-weight: 700; font-size: 1.3rem; }
.rv-word.sm .rv-l { width: 26px; height: 30px; font-size: .98rem; border-radius: 7px; }
.rv-pipe { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; box-shadow: var(--shadow); }
.rv-row { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 6px; border-radius: 12px; }
.rv-row.cur { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }

.rv-row.no { background: var(--bad-soft); }

.rv-rl { flex: none; min-width: 26px; font-size: .74rem; font-weight: 700; color: var(--ink-3); text-align: center; }
.rv-start .rv-rl { min-width: auto; padding-inline-end: 4px; }
.rv-chip { appearance: none; display: inline-flex; align-items: center; gap: 6px; min-width: 64px; min-height: 38px; padding: 4px 10px; border-radius: 10px; background: var(--violet-soft); color: var(--violet); border: 1.5px solid transparent; font-weight: 700; justify-content: center; }
button.rv-chip { cursor: pointer; }
.rv-chip b { font-family: var(--font-mono); font-size: 1.05rem; }
.rv-chip small { color: inherit; opacity: .85; font-weight: 600; }
.rv-chip.empty { background: transparent; border: 1.5px dashed var(--line-2); color: var(--ink-3); }
.rv-to { color: var(--ink-3); font-weight: 700; }
.rv-q { font-family: var(--font-display); font-size: 1.6rem; color: var(--ink-3); line-height: 1; }
.rv-broken { color: var(--bad); font-size: .8rem; font-weight: 700; }
.rv-verdict { justify-content: center; font-weight: 700; font-size: .92rem; }
.rv-verdict.ok { color: var(--good); }
.rv-verdict.no { color: var(--bad); }
.rv-msg { min-height: 0; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rv-msg.bad { color: var(--bad); padding: 8px 12px; border-radius: 12px; background: var(--bad-soft); }
.rv-msg-fig { width: 100%; }
.rv-pal-label { font-size: .78rem; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; }
.rv-pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.rv-op b { font-family: var(--font-mono); font-size: 1.3rem; color: var(--violet); line-height: 1.1; }
.rv-op small { font-size: .74rem; color: var(--ink-2); text-align: center; line-height: 1.3; }
.rv-op kbd { position: absolute; top: 4px; inset-inline-start: 6px; font-family: var(--font-mono); font-size: .62rem; color: var(--ink-3); }

.rv-note { margin: -4px 0 2px; padding-inline-start: 34px; font-size: .78rem; line-height: 1.4; color: var(--ink-2); }

/* ---------- n-back ---------- */
.nb-demo { display: grid; justify-items: center; }
.nb-demo-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.nb-demo-row small { width: 100%; text-align: center; }
.nb-mini { display: inline-grid; grid-template-columns: repeat(3, 8px); gap: 2px; padding: 4px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.nb-mini i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.nb-mini i.on { background: var(--signal); }
.nb-mini.tgt { border-color: var(--accent-fill); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-fill) 30%, transparent); }
.phase-nb .ph-body { gap: 12px; }
.nb-top { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--ink-3); font-weight: 600; }
.nb-rule { color: var(--ink-2); }
.nb-prog { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.nb-prog-fill { height: 100%; width: 0; background: var(--signal); transition: width .3s; }
.nb-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 330px; margin: 0 auto; padding: 10px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.nb-cell { aspect-ratio: 1; min-width: 0; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; transition: background .08s; }
.nb-cell.on { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 22px color-mix(in srgb, var(--signal) 55%, transparent); }
.nb-l { font-size: 2.2rem; font-weight: 700; color: #fff; }
.nb-btns { display: grid; gap: 10px; }
.nb-btns.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.nb-btn { appearance: none; position: relative; min-height: 64px; border-radius: 16px; border: 2px solid var(--line-2); background: var(--surface); cursor: pointer; display: grid; place-items: center; gap: 0; font-size: 1.05rem; transition: transform .08s, background .12s, border-color .12s; }
.nb-btn kbd { font-family: var(--font-mono); font-size: .66rem; color: var(--ink-3); }
.nb-btn:active:not(:disabled) { transform: scale(.98); }
.nb-btn:disabled { opacity: .45; cursor: default; }
.nb-btn.alt { border-color: color-mix(in srgb, var(--violet) 45%, var(--line)); }
.nb-btn.pressed { background: var(--surface-2); border-color: var(--ink-3); }
.nb-btn.hit { background: var(--good-soft); border-color: var(--good); }
.nb-btn.fa { background: var(--bad-soft); border-color: var(--bad); }
.nb-btn.miss { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); border-color: var(--warn); }
.nb-strip { display: flex; flex-wrap: wrap; gap: 5px; }
.nb-s { display: grid; justify-items: center; gap: 1px; padding: 3px; border-radius: 8px; border: 1.5px solid transparent; }
.nb-s b { font-size: .78rem; line-height: 1; }
.nb-s small { font-size: .58rem; }
.nb-s.tgt { border-color: var(--accent-fill); }
.nb-s.ok { background: var(--good-soft); }
.nb-s.no { background: var(--bad-soft); }
.nb-s.pre { opacity: .5; }

/* ---------- visual memory ---------- */
.vm-grid { display: grid; gap: 6px; width: min(360px, 100%); margin: 0 auto; padding: 10px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.vm-grid.g3 { grid-template-columns: repeat(3, 1fr); width: min(280px, 100%); }
.vm-grid.g4 { grid-template-columns: repeat(4, 1fr); }
.vm-grid.g5 { grid-template-columns: repeat(5, 1fr); }
.vm-grid.g6 { grid-template-columns: repeat(6, 1fr); gap: 5px; }
.vm-grid.mini { width: 150px; gap: 3px; padding: 5px; box-shadow: none; }
.vm-cell { appearance: none; position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--surface-2); border: 1.5px solid var(--line); padding: 0; cursor: pointer; display: grid; place-items: center; transition: background .1s, transform .08s; }
.vm-grid.mini .vm-cell { border-radius: 5px; border-width: 1px; }
.vm-cell:disabled { cursor: default; }
.vm-cell.lit { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 16px color-mix(in srgb, var(--signal) 50%, transparent); }
.vm-cell.sel { background: var(--violet-soft); border-color: var(--violet); }
.vm-cell.ok { background: var(--good); border-color: var(--good); }
.vm-cell.bad { background: var(--bad); border-color: var(--bad); }
.vm-cell.miss { border: 2.5px dashed var(--good); }
.vm-cell.hinted { box-shadow: 0 0 0 3px var(--accent-fill); }
.vm-cell.tap { animation: vmTap .25s; }
@keyframes vmTap { 50% { transform: scale(.9); background: var(--signal-soft); } }
.vm-grid.change .vm-cell { cursor: default; }
.vm-grid.change .vm-cell:not(:disabled):not(.empty) { cursor: pointer; }
.vm-grid.change .vm-cell:not(:disabled):not(.empty):hover { border-color: var(--accent-fill); }
.vm-grid.change .vm-cell.empty { background: transparent; border-style: dashed; }
.vm-grid.change .vm-cell.ok { background: var(--good-soft); border: 2.5px solid var(--good); }
.vm-grid.change .vm-cell.bad { background: var(--bad-soft); border: 2.5px solid var(--bad); }
.vm-grid.masked .vm-cell { background: repeating-linear-gradient(45deg, var(--surface-2) 0 6px, var(--line) 6px 12px); }
.vm-fig { width: 78%; height: 78%; }
.vm-n { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; color: var(--violet); }
.vm-grid.mini .vm-n { font-size: .78rem; }
.vm-n.ok { color: var(--good); }
.vm-n.no { color: var(--bad); }
.vm-count { align-self: center; font-weight: 700; color: var(--ink-2); min-width: 56px; text-align: center; }
.vm-dots { display: flex; justify-content: center; gap: 6px; }
.vm-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.vm-dots i.on { background: var(--violet); }
.vm-before { display: flex; justify-content: center; }
.vm-before .fig { width: 64px; height: 64px; }

/* ---------- math chain ---------- */
.mc-card { min-height: 190px; display: grid; place-items: center; align-content: center; gap: 4px; border-radius: 22px; background: var(--stage); color: var(--stage-ink); border: 1px solid var(--stage-line); box-shadow: inset 0 0 50px rgba(0, 0, 0, .35); }
.mc-card.blank { opacity: .6; }
.mc-lbl { font-size: .8rem; letter-spacing: .06em; color: #9AA3C2; font-weight: 600; }
.mc-v { font-family: var(--font-mono); font-size: clamp(2.8rem, 12vw, 4.2rem); font-weight: 600; line-height: 1.1; color: #FFD27A; }
.mc-v.words { font-family: var(--font-body); font-size: clamp(2rem, 9vw, 3rem); font-weight: 700; }
.mc-dots { display: flex; justify-content: center; gap: 5px; }
.mc-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.mc-dots i.on { background: var(--accent-fill); }
.mc-chain { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-mono); }
.mc-st { padding: 4px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; }
.mc-op { padding: 4px 10px; border-radius: 9px; background: var(--violet-soft); color: var(--violet); font-weight: 700; }
.mc-ar { font-style: normal; color: var(--ink-3); }
.mc-eq { color: var(--ink-3); }
.mc-eq b { color: var(--ink); }
.mc-chain.q { font-size: 1.3rem; padding: 10px; }
.mc-chain.q .mc-eq b { color: var(--accent); font-size: 1.5rem; }
.ltr-line { direction: ltr; text-align: start; font-family: var(--font-mono); font-size: .92rem; }

/* ---------- stroop ---------- */
.st-example { display: grid; justify-items: center; gap: 6px; padding: 16px; border-radius: 16px; background: var(--stage); }
.st-example small { color: #9AA3C2; }
.st-example .st-word { font-size: 2.2rem; }
.phase-st .ph-body { gap: 10px; }
.st-top { display: flex; align-items: center; gap: 10px; }
.st-count { font-size: .82rem; font-weight: 700; color: var(--ink-3); min-width: 54px; }
.st-bar { flex: 1; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.st-bar i { display: block; height: 100%; width: 0; background: var(--signal); transition: width .2s; }
.st-cue { display: grid; justify-items: center; gap: 0; padding: 8px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); }
.st-cue b { font-size: 1.25rem; }
.st-cue small { font-size: .78rem; }
.st-cue.cue-ink, .st-cue.cue-count { border-color: var(--signal); color: var(--signal); }
.st-cue.cue-word, .st-cue.cue-digit { border-color: var(--violet); color: var(--violet); border-style: dashed; }
.st-cue.sw { animation: pop .25s var(--ease); }
.st-stage { min-height: 170px; display: grid; place-items: center; border-radius: 20px; background: var(--stage); border: 3px solid var(--stage-line); transition: border-color .12s; }
.st-stage.cue-ink, .st-stage.cue-count { border-color: color-mix(in srgb, var(--s-blue) 40%, var(--stage-line)); }
.st-stage.cue-word, .st-stage.cue-digit { border-style: dashed; border-color: color-mix(in srgb, var(--s-purple) 50%, var(--stage-line)); }
.st-stage.ok { border-color: var(--s-green); border-style: solid; }
.st-stage.no { border-color: var(--s-red); border-style: solid; animation: shake .3s; }
.st-word { font-size: clamp(2.6rem, 11vw, 3.8rem); font-weight: 700; letter-spacing: .02em; }
.ink-r { color: var(--s-red); } .ink-b { color: var(--s-blue); } .ink-g { color: var(--s-green); } .ink-y { color: var(--s-yellow); } .ink-p { color: var(--s-purple); }
.st-digits { display: flex; gap: 14px; font-family: var(--font-mono); font-size: clamp(2.4rem, 10vw, 3.4rem); color: var(--stage-ink); }
.st-btns { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.st-btns.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.st-btn { appearance: none; position: relative; min-height: 70px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); box-shadow: 0 1px 0 var(--line); cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 4px; padding: 6px 2px; font-size: .86rem; font-weight: 600; transition: transform .08s; }
.st-btn:active { transform: scale(.96); }
.st-btn kbd { position: absolute; top: 3px; inset-inline-start: 6px; font-family: var(--font-mono); font-size: .6rem; color: var(--ink-3); }
.st-btn.num b { font-family: var(--font-mono); font-size: 1.6rem; }
.st-sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid color-mix(in srgb, #000 15%, transparent); }
.ink-bg-r { background: var(--s-red); } .ink-bg-b { background: var(--s-blue); } .ink-bg-g { background: var(--s-green); } .ink-bg-y { background: var(--s-yellow); } .ink-bg-p { background: var(--s-purple); }
.st-strip { display: flex; flex-wrap: wrap; gap: 6px; }
.st-s { display: inline-grid; place-items: center; padding: 4px 8px; border-radius: 10px; background: var(--stage); border: 2px solid transparent; }
.st-s .st-word { font-size: 1rem; }
.st-s .st-digits { font-size: 1rem; gap: 3px; }
.st-s.ok { border-color: var(--s-green); }
.st-s.no { border-color: var(--s-red); }

/* ---------- narrow phones (≤ 380px): keep memory rows and machine pipelines inside the screen ---------- */
.play { grid-template-columns: minmax(0, 1fr); }
.phase, .ph-body, .item-host { min-width: 0; }
.rv-pipe { overflow-x: auto; }
@media (max-width: 380px) {
  .mem-tiles { gap: 6px; }
  .mt { min-width: 44px; padding: 6px 4px 3px; }
  .mem-tiles .mono-t, .mem-tiles .heb-t { font-size: 1.65rem; }
  .rv-row { gap: 6px; padding: 4px; }
  .rv-chip { min-width: 46px; padding: 4px 6px; }
  .rv-arr.sm .rv-t { width: 21px; }
  .rv-word.sm .rv-l { width: 23px; }
  .rv-t { width: 30px; }
  .rv-l { width: 32px; }
}

/* ===== styles/stats.css : charts, analytics, Time Attack, daily, settings, achievements ===== */

/* ---------- chart tokens (validated: categorical 3 slots, light on #FFFFFF, dark on #121929; heat ramps ordinal) ---------- */
:root {
  --c1: #0090A3; --c2: #C9720A; --c3: #6B4FD3;
  --c-grid: rgba(18, 24, 41, .07);
  --hm0: rgba(18, 24, 41, .06); --hm1: #74BCC6; --hm2: #3A9DAA; --hm3: #0E7C89; --hm4: #0A535D;
  --raise: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c1: #169FAE; --c2: #CC8019; --c3: #8A78E6;
    --c-grid: rgba(232, 236, 247, .07);
    --hm0: rgba(232, 236, 247, .06); --hm1: #1F6A74; --hm2: #24909C; --hm3: #4DBFCB; --hm4: #A2E8EF;
    --raise: #2A3452;
  }
}
:root[data-theme="dark"] {
  --c1: #169FAE; --c2: #CC8019; --c3: #8A78E6;
  --c-grid: rgba(232, 236, 247, .07);
  --hm0: rgba(232, 236, 247, .06); --hm1: #1F6A74; --hm2: #24909C; --hm3: #4DBFCB; --hm4: #A2E8EF;
  --raise: #2A3452;
}
.s1 { --c: var(--c1); }
.s2 { --c: var(--c2); }
.s3 { --c: var(--c3); }

/* ---------- route layouts ---------- */
.view > .chart-card, .view > .card + .card, .view > .cat-stats + .chart-card { margin-top: 14px; }
.view[data-route="stats"] { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
.view[data-route="stats"] > * { margin: 0; min-width: 0; }
@media (min-width: 900px) {
  .view[data-route="stats"] { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: row dense; }
  .view[data-route="stats"] > :not(.chart-card), .view[data-route="stats"] > .span2 { grid-column: 1 / -1; }
}
.view[data-route="settings"] > *, .view[data-route="badges"] > .lvl-card { max-width: 760px; margin-inline: auto; }

/* ---------- shared controls ---------- */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; max-width: 100%; }
.seg-b {
  appearance: none; border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
  flex: 1 0 auto; min-height: 36px; padding: 6px 13px; border-radius: 9px;
  font-weight: 600; font-size: .86rem; line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums;
  transition: background .15s, color .15s, box-shadow .15s;
}
.seg-b:hover { color: var(--ink); }
.seg-b.on { background: var(--raise); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1), 0 0 0 1px var(--line); }
.sel {
  appearance: none; -webkit-appearance: none; font: inherit; font-size: .9rem; font-weight: 600; color: var(--ink); cursor: pointer;
  min-height: 42px; padding: 0 14px 0 34px; border-radius: 12px; border: 1px solid var(--line); background-color: var(--surface);
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: 14px 50%, 19px 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  max-width: 100%;
}
.sel:hover { border-color: var(--line-2); }
.switch {
  appearance: none; border: 0; padding: 0; cursor: pointer; flex: none; position: relative;
  width: 50px; height: 30px; border-radius: 99px; background: var(--line-2); transition: background .2s;
}
.switch i { position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .22s var(--ease); }
.switch.on { background: var(--good); }
.switch.on i { transform: translateX(-20px); }
[dir="ltr"] .switch.on i { transform: translateX(20px); }
.top-back { margin-inline-start: -8px; }
.ph-diff-label { font-size: .74rem; }
.nb-count { color: var(--ink-3); font-size: .85rem; }

/* ---------- chart primitives ---------- */
.chart { display: block; overflow: visible; direction: ltr; font-family: var(--font-body); user-select: none; -webkit-user-select: none; }
.chart text { font-variant-numeric: tabular-nums; }
.c-grid { stroke: var(--c-grid); stroke-width: 1; }
.c-axis { stroke: var(--line-2); stroke-width: 1; }
.c-tick { fill: var(--ink-3); font-size: 11px; }
.c-glabel { fill: var(--ink-2); font-size: 11.5px; }
.c-val { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.c-line { fill: none; stroke: var(--c, var(--ink-3)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-area { fill: var(--c, var(--ink-3)); stroke: none; opacity: .1; }
.c-area.strong { opacity: .18; }
.c-dot { fill: var(--c, var(--ink-3)); stroke: var(--surface); stroke-width: 2; }
.c-dot.hov { stroke-width: 2.5; }
.c-cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.c-ref { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 5 4; opacity: .8; }
.c-ref-l { fill: var(--ink-3); font-size: 11px; }
.c-hit { cursor: crosshair; touch-action: pan-y; }
.c-bar { fill: var(--c, var(--ink-3)); cursor: pointer; transition: opacity .15s; outline: none; }
.c-bar:hover, .c-bar:focus-visible { opacity: .8; }
.radar { display: block; margin: 0 auto; height: auto; }
.r-label { fill: var(--ink-2); font-size: 12px; }
.r-label.muted { fill: var(--ink-3); opacity: .7; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--ink-3)); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.ctip {
  position: fixed; z-index: 70; pointer-events: none; direction: rtl;
  min-width: 120px; max-width: 260px; padding: 8px 10px; border-radius: 10px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg);
  font-size: .82rem; line-height: 1.45;
}
.ct-h { font-weight: 600; color: var(--ink-2); font-size: .78rem; margin-bottom: 2px; }
.ct-r { display: flex; align-items: center; gap: 6px; }
.ct-r span { flex: 1; color: var(--ink-2); }
.ct-r b { font-variant-numeric: tabular-nums; }

/* chart card */
.chart-card { display: grid; gap: 12px; min-width: 0; align-content: start; }
.cc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.cc-head h3, .card .cc-head h3 { margin: 0; font-size: 1.02rem; }
.cc-sub { color: var(--ink-3); font-size: .84rem; line-height: 1.5; margin-top: 2px; }
.cc-toggle {
  appearance: none; flex: none; cursor: pointer; min-height: 32px; padding: 4px 11px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); font-size: .78rem; font-weight: 600;
}
.cc-toggle:hover { border-color: var(--line-2); color: var(--ink); }
.cc-toggle[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: transparent; }
.cc-body { position: relative; min-width: 0; min-height: 60px; }
.cc-body .empty { padding: 20px 12px; }
.cc-table { min-width: 0; }
.tbl-wrap { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); color: var(--ink-2); font-weight: 600; text-align: start; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-2); }

/* horizontal bars */
.hbars { display: grid; gap: 2px; }
.hb-row { display: grid; grid-template-columns: minmax(104px, 36%) minmax(0, 1fr) 40px; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 9px; outline: none; }
.hb-row:hover, .hb-row:focus-visible { background: var(--surface-2); }
.hb-label { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-label .ic { color: var(--ink-3); }
.hb-track { display: block; height: 10px; border-radius: 4px; border-start-start-radius: 0; border-end-start-radius: 0; background: var(--hm0); overflow: hidden; }
.hb-fill { display: block; height: 100%; background: var(--c, var(--ink-3)); border-start-end-radius: 4px; border-end-end-radius: 4px; transition: width .5s var(--ease); }
.hb-val { text-align: end; font-size: .85rem; font-weight: 600; color: var(--ink-2); }

/* heatmap */
.heat { display: block; margin-inline: auto; height: auto; }
.hm { fill: var(--hm0); background: var(--hm0); outline: none; }
.hm.l1 { fill: var(--hm1); background: var(--hm1); }
.hm.l2 { fill: var(--hm2); background: var(--hm2); }
.hm.l3 { fill: var(--hm3); background: var(--hm3); }
.hm.l4 { fill: var(--hm4); background: var(--hm4); }
rect.hm:hover, rect.hm:focus-visible { stroke: var(--ink); stroke-width: 1.5; }

  const pad2 = n => String(n).padStart(2, '0');
  const fmtSec = ms => (ms / 1000).toFixed(ms < 10000 ? 1 : 0);
  const fmtMs = ms => (ms == null || isNaN(ms) ? '—' : ms < 1000 ? `${Math.round(ms)} מ״ש` : `${(ms / 1000).toFixed(1)} שנ׳`);
  const fmtPct = x => (x == null || isNaN(x) ? '—' : `${Math.round(x * 100)}%`);
  const fmtNum = n => (n == null ? '—' : Number(n).toLocaleString('he-IL'));
  const fmtDur = ms => {
    const m = Math.round(ms / 60000);

    const hh = Math.floor(m / 60), mm = m % 60;
    return mm ? `${hh} שע׳ ${mm} דק׳` : `${hh} שע׳`;
  };
  const dayKey = (ts = Date.now()) => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const dayFromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = dayFromKey(k); d.setDate(d.getDate() + n); return dayKey(d.getTime()); };
  const HEB_DAYS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const HEB_MONTHS = ['ינו׳', 'פבר׳', 'מרץ', 'אפר׳', 'מאי', 'יוני', 'יולי', 'אוג׳', 'ספט׳', 'אוק׳', 'נוב׳', 'דצמ׳'];

    `(?<![\\d\\w\\u2066.])(?:[+\\-−]\\s?)?\\(?${BIDI_NUM}\\)?(?:\\s*[+\\-−×÷*/=<>≠≈–]\\s*\\(?[+\\-−]?${BIDI_NUM}\\)?)+` +
    `|(?<=^|[\\s(:\\u05BE])[+\\-−×÷]\\d+(?:,\\d{3})*(?:\\.\\d+)?%?`, 'g');

    BIDI_RE.lastIndex = 0;
    if (!BIDI_RE.test(t)) return;
    const p = node.parentElement;
    if (!p || p.closest(BIDI_SKIP)) return;
    BIDI_RE.lastIndex = 0;
    const out = t.replace(BIDI_RE, m => (/\d/.test(m) ? iso(m) : m));
    if (out !== t) node.data = out;
  }
  function bidiTree(root) {
    if (!root) return;
    if (root.nodeType === 3) { bidiText(root); return; }
    if (root.nodeType !== 1 || (root.closest && root.closest(BIDI_SKIP))) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) bidiText(n);
  }
  function bidiWatch(root) {

      }
    }).observe(root, { childList: true, subtree: true, characterData: true });
  }

  // ---------- Hebrew helpers ----------
  const HEB_LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת'.split('');
  const FINAL = { 'כ': 'ך', 'מ': 'ם', 'נ': 'ן', 'פ': 'ף', 'צ': 'ץ' };
  const UNFINAL = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
  const GEM = { 'א': 1, 'ב': 2, 'ג': 3, 'ד': 4, 'ה': 5, 'ו': 6, 'ז': 7, 'ח': 8, 'ט': 9, 'י': 10, 'כ': 20, 'ל': 30, 'מ': 40, 'נ': 50, 'ס': 60, 'ע': 70, 'פ': 80, 'צ': 90, 'ק': 100, 'ר': 200, 'ש': 300, 'ת': 400 };
  const normHeb = w => w.split('').map(c => UNFINAL[c] || c).join('');
  const finalize = w => { if (!w) return w; const last = w[w.length - 1]; return FINAL[last] ? w.slice(0, -1) + FINAL[last] : w; };
  // gender inflection: g(person,'הלך','הלכה')
  const g = (p, m, f) => (p && p.f ? f : m);
  const plural = (n, one, many) => (n === 1 ? one : `${n} ${many}`);

  return {
    rng, hashStr, seedFor, randomSeed, uid, clamp, lerp, range, sum, avg, median, gcd, uniq, eqArr, isPrime,
    h, s, svgEl, $, $$, clear, html, ltr, iso, bidiText, bidiTree, bidiWatch, BIDI_RE, append, SVGNS,
    sleep, now, raf, reducedMotion,
    pad2, fmtSec, fmtMs, fmtPct, fmtNum, fmtDur, dayKey, dayFromKey, addDays, shortDate, HEB_DAYS, HEB_MONTHS,
    HEB_LETTERS, FINAL, UNFINAL, GEM, normHeb, finalize, g, plural,
  };
})();

    speed:   { name: 'מהירות עיבוד',    short: 'מהירות' },
    spatial: { name: 'חשיבה מרחבית',    short: 'מרחבי' },
    algo:    { name: 'חשיבה אלגוריתמית', short: 'אלגוריתמי' },
