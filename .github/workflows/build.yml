name: Build FocusGuard Android APK (Mobile Direct)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Embedded Native Android Project
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            echo "" | base64 -d > project_src.zip
            unzip -o project_src.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Native APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases for Direct Phone Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FocusGuard APK - הורדה ישירה לטלפון (#${{ github.run_number }})"
          body: |
            ### 📱 הורדה ישירה לטלפון אנדרואיד
            לחץ על הקובץ **`FocusGuard.apk`** למטה מתוך דפדפן הטלפון שלך כדי להוריד ולהתקין את האפליקציה ישירות על המכשיר.
          files: |
            app/build/outputs/apk/debug/app-debug.apk#FocusGuard.apk
