# === FocusGuard v1.5 - תיקון קפיצת פרסומות + איפוס ב-04:00 בלילה ===
name: Build FocusGuard v1.5 APK (Reset 04:00 AM)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Embedded Native Android Project (v1.5)
        run: |
          echo "" | base64 -d > project_src.zip
          unzip -o project_src.zip
          rm -f project_src.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Native APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FocusGuard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APK
          path: FocusGuard.apk

      - name: Publish APK to Releases for Direct Phone Download
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: "FocusGuard v1.5 APK - איפוס ב-04:00 בלילה (#${{ github.run_number }})"
          body: |
            ### 📱 הורדה ישירה לטלפון אנדרואיד (גרסה 1.4 - איפוס ב-04:00 בלילה)
            לחץ על הקובץ **`FocusGuard.apk`** למטה מתוך דפדפן הטלפון שלך כדי להוריד ולהתקין את העדכון ישירות על המכשיר.
          files: FocusGuard.apk
