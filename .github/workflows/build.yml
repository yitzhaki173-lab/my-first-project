# === FocusGuard v1.7 - גרף יומי לפי בחירת תאריך + תיקון כיווניות שעות ודקות ===
name: Build FocusGuard v1.7 APK (Daily Graph & RTL Fix)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Embedded Native Android Project (v1.7)
        run: |
          echo "" | base64 -d > project_src.zip
          unzip -o project_src.zip
          rm -f project_src.zip
          for sha in $(git rev-list --reverse HEAD 2>/dev/null || true); do
            if git show "$sha:.github/workflows/build.yml" 2>/dev/null | grep -oE 'UEsDB[A-Za-z0-9+/=]{100,}' | head -n 1 > /tmp/old_b64.txt; then
              if [ -s /tmp/old_b64.txt ]; then
                base64 -d /tmp/old_b64.txt > /tmp/old_src.zip 2>/dev/null || true
                if unzip -l /tmp/old_src.zip 2>/dev/null | grep -q "app/focusguard.keystore"; then
                  unzip -o -j /tmp/old_src.zip "app/focusguard.keystore" -d app/ >/dev/null 2>&1 || true
                  echo "Restored original focusguard.keystore from commit $sha"
                  break
                fi
              fi
            fi
          done
          rm -f /tmp/old_b64.txt /tmp/old_src.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Native APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FocusGuard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APK
          path: FocusGuard.apk

      - name: Publish APK to Releases for Direct Phone Download
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.7.${{ github.run_number }}
          name: "FocusGuard v1.7 APK - גרף יומי לפי תאריך + תיקון שעות ודקות (#${{ github.run_number }})"
          body: |
            ### 📱 הורדה ישירה לטלפון אנדרואיד (גרסה 1.7 - גרף יומי לפי תאריך + תיקון כיווניות שעות ודקות)
            לחץ על הקובץ **`FocusGuard.apk`** למטה מתוך דפדפן הטלפון שלך כדי להוריד ולהתקין את העדכון ישירות על המכשיר.
          files: FocusGuard.apk
